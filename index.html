    <title>Swift Coding Club · Parul University</title>
    <style>
      /* Inline splash — appears instantly, hidden by JS once the React app boots. */
      html, body { margin: 0; padding: 0; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; background: #FFF8F2; color: #0B0B0C; overflow-x: clip; }
      body.app-ready { animation: heroFadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes heroFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      #splash-static {
        position: fixed; inset: 0; z-index: 200;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse at 15% -5%, rgba(240,81,56,0.35), transparent 50%),
          radial-gradient(ellipse at 105% 15%, rgba(255,211,188,0.35), transparent 45%),
          linear-gradient(180deg, #FFF8F2, #FFE4D6);
        transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }
      body.app-ready #splash-static { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .s-mark {
        position: relative; width: 80px; height: 80px;
        border-radius: 24px; background: #F05138;
        box-shadow: 0 24px 50px -18px rgba(240,81,56,0.7), inset 0 0 0 2px rgba(255,255,255,0.12);
        display: flex; align-items: center; justify-content: center;
        animation: splashPop 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .s-mark svg { width: 60px; height: 60px; }
      .s-mark::after {
        content: ""; position: absolute; inset: 0; border-radius: 24px;
        border: 2px solid rgba(255,255,255,0.4);
        animation: splashRing 6s linear infinite;
      }
      .s-rings span {
        position: absolute; left: 50%; top: 50%; width: 96px; height: 96px;
        margin: -48px 0 0 -48px; border-radius: 50%;
        border: 1px solid rgba(240,81,56,0.35);
        animation: splashPing 3s ease-out infinite;
      }
      .s-rings span:nth-child(2) { animation-delay: -1s; border-color: rgba(240,81,56,0.25); }
      .s-rings span:nth-child(3) { animation-delay: -2s; border-color: rgba(240,81,56,0.15); }
      .s-title {
        margin: 28px 0 4px; font-size: clamp(28px, 5vw, 44px); font-weight: 800;
        letter-spacing: -0.04em; line-height: 1;
        animation: splashRise 0.9s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .s-sub {
        font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
        letter-spacing: 0.28em; text-transform: uppercase; color: #6B5F5A;
        animation: splashRise 0.9s 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .s-bar {
        margin-top: 40px; height: 4px; width: min(384px, 70vw);
        background: rgba(11,11,12,0.08); border-radius: 999px; overflow: hidden; position: relative;
        animation: splashRise 0.9s 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .s-bar::before {
        content: ""; position: absolute; inset: 0 100% 0 0;
        background: linear-gradient(90deg, #F05138, #FF7A5C);
        animation: splashFill 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .s-bar::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 33%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        animation: splashShine 1.4s linear infinite;
      }
      .s-foot {
        margin-top: 12px; display: flex; gap: 12px; align-items: center; justify-content: center;
        font-family: "JetBrains Mono", monospace; font-size: 10px;
        letter-spacing: 0.22em; text-transform: uppercase; color: #6B5F5A;
        animation: splashRise 0.9s 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .s-line { height: 1px; width: 80px; background: rgba(11,11,12,0.12); }
      .s-tags {
        margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
        animation: splashRise 0.9s 1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .s-tag {
        padding: 5px 12px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
        letter-spacing: 0.16em; text-transform: uppercase;
        box-shadow: 0 4px 0 rgba(11,11,12,0.9);
      }
      .s-corner {
        position: absolute; top: 18px; left: 0; right: 0; text-align: center;
        font-family: "JetBrains Mono", monospace; font-size: 10px;
        letter-spacing: 0.3em; text-transform: uppercase; color: #6B5F5A;
        animation: splashRise 0.9s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .s-bottom {
        position: absolute; bottom: 24px; left: 0; right: 0; text-align: center;
        font-family: "JetBrains Mono", monospace; font-size: 10px;
        letter-spacing: 0.24em; text-transform: uppercase; color: #6B5F5A;
      }
      @keyframes splashPop {
        0% { transform: scale(0.2) rotate(-25deg); opacity: 0; filter: blur(10px); }
        60% { transform: scale(1.12) rotate(6deg); opacity: 1; filter: blur(0); }
        100% { transform: scale(1) rotate(0); opacity: 1; filter: blur(0); }
      }
      @keyframes splashRise {
        from { opacity: 0; transform: translateY(22px); filter: blur(4px); }
        to   { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      @keyframes splashRing { to { transform: rotate(360deg); } }
      @keyframes splashPing {
        0% { transform: scale(0.6); opacity: 0.7; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      @keyframes splashFill { to { inset: 0 0 0 0; } }
      @keyframes splashShine { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
      @media (prefers-reduced-motion: reduce) {
        .s-mark, .s-title, .s-sub, .s-bar, .s-foot, .s-tags, .s-corner, .s-rings span, .s-mark::after, .s-bar::before, .s-bar::after {
          animation: none !important;
        }
        .s-bar::before { inset: 0; }
      }
    </style>
  </head>

      <div class="s-bottom">Designed &amp; built by students · Vadodara</div>
    </div>
    <div id="root"></div>
    <script>
      // Tell the static splash to fade out as soon as React has committed and fonts are ready.
      (function () {
        const dismiss = () => {
          requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('app-ready')));
          setTimeout(() => { var s = document.getElementById('splash-static'); if (s) s.remove(); }, 1200);
        };
        // If the React app paints within 1.4s, dismiss on font-ready.
        if ('fonts' in document) {
          Promise.race([document.fonts.ready, new Promise(function (r) { return setTimeout(r, 1100); })]).then(dismiss);
        } else {
          setTimeout(dismiss, 1100);
        }
        // Hard fallback in case React never finishes.
        setTimeout(dismiss, 2500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
